name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build --configuration Release

      - name: Package
        run: |
          $dllDir = "MagicBulletFullEffects\bin\Release\MagicBulletFullEffects"
          if (-not (Test-Path $dllDir)) {
            Write-Error "Output directory not found: $dllDir"
            exit 1
          }
          Compress-Archive -Path "$dllDir\*" -DestinationPath latest.zip -Force
          Get-ChildItem $dllDir -Name

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          generate_release_notes: true

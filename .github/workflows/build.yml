name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Build
        run: dotnet build --configuration Release

      - name: Package
        run: |
          $releaseDir = "MagicBulletFullEffects\bin\Release"
          $dllPath = Join-Path $releaseDir "MagicBulletFullEffects.dll"
          $jsonPath = Join-Path $releaseDir "MagicBulletFullEffects.json"
          
          if (-not (Test-Path $dllPath)) { Write-Error "DLL not found: $dllPath"; exit 1 }
          if (-not (Test-Path $jsonPath)) { Write-Error "JSON not found: $jsonPath"; exit 1 }
          
          Write-Host "Packaging: $dllPath + $jsonPath"
          Compress-Archive -Path $dllPath, $jsonPath -DestinationPath latest.zip -Force
          Get-ChildItem latest.zip | ForEach-Object { "$($_.Name) - $($_.Length) bytes" }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.zip
          generate_release_notes: true
